services:
  - type: web
    name: doc-qa-backend
    env:  python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main: app --host 0.0.0.0 --port $PORT
    envVars:
      - key:  PYTHON_VERSION
        value: 3.10. 0
      - key: GROQ_API_KEY
        sync:  false
